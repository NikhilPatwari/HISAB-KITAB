services:
  db:
    image: postgres:16-alpine
    container_name: hisabkitab-db
    environment:
      POSTGRES_DB: hisabkitab
      POSTGRES_USER: hisabkitab
      POSTGRES_PASSWORD: hisabkitab
    ports:
      - "5432:5432"
    volumes:
      - hisabkitab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hisabkitab -d hisabkitab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hisabkitab_pgdata:
