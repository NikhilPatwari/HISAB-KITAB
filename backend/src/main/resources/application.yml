server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: hisabkitab
  datasource:
    # Points at a PostgreSQL installed on this machine, connecting as the
    # superuser the installer created. Create the database once with
    # backend/db/setup.sql.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hisabkitab}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    hikari:
      # A local server is not a pool of one, but a farm office does not need 10.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: ${SHOW_SQL:false}
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

hisabkitab:
  jwt:
    # Override in production. Must be at least 32 bytes for HS256.
    secret: ${JWT_SECRET:change-me-in-production-hisab-kitab-farm-ledger-secret-key}
    expiry-hours: ${JWT_EXPIRY_HOURS:720}
  cors:
    # Origin *patterns*, not exact origins: the dev server port moves when 5173 is
    # taken, 127.0.0.1 and localhost are different origins to a browser, and a
    # phone testing the mobile layout arrives from a LAN address.
    # Narrow this to the real origins when deploying.
    allowed-origins: '${CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*:[*],http://10.*:[*]}'
  bootstrap:
    # Creates the first organization + owner login on an empty database.
    enabled: ${BOOTSTRAP_ENABLED:true}
    organization-name: ${BOOTSTRAP_ORG:My Farm}
    owner-name: ${BOOTSTRAP_OWNER_NAME:Owner}
    username: ${BOOTSTRAP_USERNAME:owner}
    password: ${BOOTSTRAP_PASSWORD:owner123}
    # Adds sample employees, attendance and ledger entries. Turn off for real use.
    seed-demo-data: ${SEED_DEMO:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.hisabkitab: ${LOG_LEVEL:INFO}
